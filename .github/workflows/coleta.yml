name: Coleta de estoque

on:
  schedule:
    # 9h e 15h no horário de Brasília: a maioria das fontes atualiza de manhã.
    - cron: '0 12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  # Grava as leituras no banco de produção. Uma fonte fora do ar ou com layout novo
  # aparece como anotação no resumo da execução.
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Coleta as fontes
        working-directory: api
        run: go run ./cmd/coletor
        env:
          # Conexão direta (sem pooler) com o banco de produção no Neon.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
