name: Coleta de estoque

on:
  schedule:
    # 9h e 15h no horário de Brasília: a maioria das fontes atualiza de manhã.
    - cron: '0 12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Coleta as fontes
        run: npm run coletar -- coleta.sql

      - name: Grava no D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute mapa-do-sangue --remote --file coleta.sql

      # Enquanto o D1 não estiver configurado, o SQL fica disponível como artefato.
      - uses: actions/upload-artifact@v7
        with:
          name: coleta-${{ github.run_id }}
          path: coleta.sql
          retention-days: 30
