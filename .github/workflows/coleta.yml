name: Coleta de estoque

on:
  schedule:
    # 9h e 15h no horário de Brasília: a maioria das fontes atualiza de manhã.
    - cron: '0 12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  # Enquanto a API não está no ar, a coleta grava num Postgres temporário: serve para
  # avisar (anotação no resumo) quando uma fonte sai do ar ou muda o layout.
  coletar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mapa
          POSTGRES_PASSWORD: mapa
          POSTGRES_DB: mapa
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mapa" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Coleta as fontes
        working-directory: api
        run: go run ./cmd/coletor
        env:
          DATABASE_URL: postgres://mapa:mapa@localhost:5432/mapa?sslmode=disable
