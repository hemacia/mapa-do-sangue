name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # upload no Codecov por OIDC, sem token salvo no repositório

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes de unidade com cobertura
        run: npm run test:coverage

      - name: Envia cobertura para o Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: ${{ runner.os }}
          use_oidc: true
          fail_ci_if_error: false

      - name: Instala navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e
        run: npm run test:e2e

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ runner.os }}
          path: playwright-report
          retention-days: 7
