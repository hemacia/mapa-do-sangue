name: Estatísticas da Anvisa

on:
  schedule:
    # Dia 5 de cada mês, 9h de Brasília. A Anvisa troca o CSV nacional sem data fixa.
    - cron: '0 12 5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anvisa
  cancel-in-progress: false

jobs:
  # Atualiza as estatísticas no banco de produção. Falha quando o CSV ou a API do IBGE
  # mudarem de formato.
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Atualiza pelo CSV nacional
        working-directory: api
        run: go run ./cmd/coletor -anvisa
        env:
          # Conexão direta (sem pooler) com o banco de produção no Neon.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
