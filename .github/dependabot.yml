version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias-de-desenvolvimento:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # os tipos acompanham a versão do Node usada no CI (.nvmrc)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      dependencias-de-desenvolvimento:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/api]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
