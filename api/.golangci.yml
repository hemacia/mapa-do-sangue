version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofumpt
    - goimports
