openapi: 3.0.3
info:
  title: Mapa do Sangue API
  version: 1.0.0
  description: Estoque de sangue dos hemocentros do Brasil, estatísticas por estado e registro anônimo de doações.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: verificarSaude
      summary: O processo está no ar
      responses:
        "200":
          description: Vivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
  /readyz:
    get:
      operationId: verificarProntidao
      summary: O processo está pronto para receber tráfego (banco acessível)
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Saude" }
        "503": { $ref: "#/components/responses/Problema" }
  /v1/estoque:
    get:
      operationId: listarEstoque
      summary: Estoque atual de cada hemocentro
      parameters:
        - name: uf
          in: query
          required: false
          schema: { $ref: "#/components/schemas/UF" }
      responses:
        "200":
          description: Hemocentros com o último nível de cada tipo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EstoqueHemocentro" }
        "400": { $ref: "#/components/responses/Problema" }
  /v1/estatisticas:
    get:
      operationId: listarEstatisticas
      summary: Coletas por mil habitantes em cada estado (Anvisa Hemoprod + IBGE)
      responses:
        "200":
          description: Uma linha por UF, da maior taxa para a menor
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EstatisticaUF" }
  /v1/pontos-coleta:
    get:
      operationId: listarPontosColeta
      summary: Unidades de hemoterapia do CNES que podem receber doador em um estado
      parameters:
        - name: uf
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UF" }
      responses:
        "200":
          description: Unidades públicas primeiro, depois por cidade e nome
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PontoColeta" }
        "400": { $ref: "#/components/responses/Problema" }
  /v1/alertas:
    get:
      operationId: listarAlertas
      summary: Notícias de estoque baixo publicadas nos últimos 30 dias pelos sites oficiais do estado
      parameters:
        - name: uf
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UF" }
      responses:
        "200":
          description: Da mais recente para a mais antiga, no máximo 3
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertaNoticiado" }
        "400": { $ref: "#/components/responses/Problema" }
  /v1/hemocentros/{id}/historico:
    get:
      operationId: historicoDoHemocentro
      summary: Nível de cada tipo dia a dia nos últimos 90 dias (a última leitura de cada dia)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
      responses:
        "200":
          description: Do dia mais antigo para o mais recente; vazio se o hemocentro não existe
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiaEstoque" }
        "400": { $ref: "#/components/responses/Problema" }
  /v1/doacoes:
    post:
      operationId: registrarDoacao
      summary: Registra uma doação (só estado e tipo, sem dado pessoal)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NovaDoacao" }
      responses:
        "201":
          description: Registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Doacao" }
        "400": { $ref: "#/components/responses/Problema" }
        "429": { $ref: "#/components/responses/Problema" }
  /v1/doacoes/mes:
    get:
      operationId: contarDoacoesDoMes
      summary: Total de doações registradas no mês corrente (horário de Brasília)
      responses:
        "200":
          description: Total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotalDoMes" }
components:
  responses:
    Problema:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    UF:
      type: string
      pattern: "^[A-Z]{2}$"
      example: MG
    TipoSanguineo:
      type: string
      enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
    Nivel:
      type: string
      description: Escala comum, do pior para o melhor
      enum: [critico, alerta, estavel, adequado]
    Saude:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    HistoricoTipo:
      type: object
      required: [dias, diasCriticos]
      properties:
        dias: { type: integer }
        diasCriticos: { type: integer }
    Bolsas:
      type: object
      required: [bolsas, minimo]
      properties:
        bolsas: { type: integer }
        minimo:
          type: integer
          description: Quantidade a partir da qual a própria fonte considera o estoque fora de risco
    EstoqueHemocentro:
      type: object
      required: [id, nome, uf, cidade, nivelGeral, estoque, coletadoEm, historico]
      properties:
        id: { type: string, example: hemominas-bh }
        nome: { type: string }
        uf: { $ref: "#/components/schemas/UF" }
        cidade: { type: string }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        nivelGeral: { $ref: "#/components/schemas/Nivel" }
        estoque:
          type: object
          description: Nível por tipo sanguíneo (só os tipos que a fonte publica)
          additionalProperties: { $ref: "#/components/schemas/Nivel" }
        atualizadoNaFonte:
          type: string
          nullable: true
          description: AAAA-MM-DD ou AAAA-MM-DDTHH:MM, no horário da fonte
        coletadoEm: { type: string, format: date-time }
        bolsas:
          type: object
          description: Bolsas em estoque e mínimo por tipo, só nas fontes que publicam o número
          additionalProperties: { $ref: "#/components/schemas/Bolsas" }
        historico:
          type: object
          description: Dias com leitura e dias em nível crítico nos últimos 30 dias, por tipo
          additionalProperties: { $ref: "#/components/schemas/HistoricoTipo" }
    EstatisticaUF:
      type: object
      required: [uf, ano, coletas, populacao, porMil, cobertura]
      properties:
        uf: { $ref: "#/components/schemas/UF" }
        ano: { type: integer }
        coletas: { type: integer, nullable: true }
        populacao: { type: integer }
        porMil: { type: number, format: double, nullable: true }
        cobertura:
          type: string
          enum: [completo, incompleto, sem-dado]
        serie:
          type: array
          description: Coletas de todos os anos importados, do mais antigo ao mais recente
          items: { $ref: "#/components/schemas/AnoColetas" }
        indicadores:
          type: object
          description: >
            Doadores aptos no ano (primeira_vez, repeticao, esporadico, espontanea, reposicao, feminino,
            masculino, ate_29_anos, acima_29_anos, tipo_A+ ... tipo_O-) e candidatos inaptos
          additionalProperties: { type: integer }
        parcial: { $ref: "#/components/schemas/ParcialUF" }
    ParcialUF:
      type: object
      description: >
        Ano em andamento: coletas de janeiro até ateMes, comparadas ao mesmo período do ano anterior,
        só nas unidades que enviaram todos esses meses nos dois anos
      required: [ano, ateMes, coletas, coletasAnoAnterior]
      properties:
        ano: { type: integer }
        ateMes: { type: integer }
        coletas: { type: integer }
        coletasAnoAnterior: { type: integer }
    DiaEstoque:
      type: object
      required: [data, estoque]
      properties:
        data: { type: string, format: date }
        estoque:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Nivel" }
    AlertaNoticiado:
      type: object
      required: [uf, fonte, titulo, url, publicadoEm]
      properties:
        uf: { $ref: "#/components/schemas/UF" }
        fonte: { type: string }
        titulo: { type: string }
        url: { type: string }
        publicadoEm: { type: string, format: date-time }
    PontoColeta:
      type: object
      required: [cnes, nome, uf, latitude, longitude, publico]
      properties:
        cnes: { type: integer }
        nome: { type: string }
        uf: { $ref: "#/components/schemas/UF" }
        cidade: { type: string, nullable: true }
        endereco: { type: string, nullable: true }
        bairro: { type: string, nullable: true }
        telefone: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        publico: { type: boolean }
    AnoColetas:
      type: object
      required: [ano, coletas, porMil]
      properties:
        ano: { type: integer }
        coletas: { type: integer, nullable: true }
        porMil: { type: number, format: double, nullable: true }
    NovaDoacao:
      type: object
      required: [uf]
      properties:
        uf: { $ref: "#/components/schemas/UF" }
        tipo:
          allOf: [{ $ref: "#/components/schemas/TipoSanguineo" }]
          nullable: true
    Doacao:
      type: object
      required: [uf, tipo, data]
      properties:
        uf: { $ref: "#/components/schemas/UF" }
        tipo:
          allOf: [{ $ref: "#/components/schemas/TipoSanguineo" }]
          nullable: true
        data: { type: string, format: date }
    TotalDoMes:
      type: object
      required: [mes, total, hoje]
      properties:
        mes: { type: string, example: "2026-11" }
        total: { type: integer }
        hoje: { type: integer, description: Doações registradas hoje, no horário de Brasília }
    Problema:
      type: object
      description: RFC 9457 Problem Details
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
